# @package _global_
# Synthetic vMF-mixture sphere data with controlled concentration (see scripts/make_synth_sphere.py).
# Usage: python -m rmf.train experiment=meanflow/meanflow_earth_synth data.dataset_file=synth_k25 ...

defaults:
  - override /data: earth
  - override /model: meanflow_amino
  - override /callbacks: default
  - override /trainer: default

tags: ["earth", "synth", "meanflow"]
seed: 12345

trainer:
  min_epochs: 50
  max_epochs: 200
  gradient_clip_val: null

model:
  optimizer:
    lr: 1e-4
    weight_decay: 0.01
  net:
    num_layers: 6
    d_model: 512
    d_in: 3
  atol: 1e-7
  rtol: 1e-7
  in_shape:
    - 3
  prop_equal_times: 0.75
  manifold: sphere
  epoch: 100
  my_method: "mf"
  val_step: 8

callbacks:
  early_stopping:
    monitor: val/mmd-001
    mode: min

data:
  batch_size: 4096
  dataset_file: synth_k25
