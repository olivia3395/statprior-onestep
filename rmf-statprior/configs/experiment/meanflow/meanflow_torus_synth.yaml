# @package _global_
# Dimension-scaling study on synthetic torus mixtures (scripts/torus_synth.py).
# Set the dimension on the command line, e.g.
#   python -m rmf.train experiment=meanflow/meanflow_torus_synth data.data_type=tsynth_d10 model.net.d_in=10 "model.in_shape=[10]"
defaults:
  - override /data: amino_general
  - override /model: meanflow_amino
  - override /callbacks: default
  - override /trainer: default
tags: ["torus_synth", "meanflow"]
seed: 0
trainer:
  min_epochs: 1
  max_epochs: 500
  gradient_clip_val: null
model:
  optimizer:
    lr: 1e-4
    weight_decay: 0.01
  net:
    num_layers: 6
    d_model: 512
    d_in: 10
  in_shape:
    - 10
  prop_equal_times: 0.75
  epoch: 100
  my_method: "mf"
  val_step: 8
callbacks:
  early_stopping:
    monitor: val/mmd-001
    mode: min
data:
  batch_size: 4096
  data_type: tsynth_d10
  data_dir: data/torus_synth
logger:
  wandb:
    tags: ${tags}
    group: "torus_synth"
  aim:
    experiment: "torus_synth"
