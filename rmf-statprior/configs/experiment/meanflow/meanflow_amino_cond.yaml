# @package _global_
# Residue-type-conditioned generation of backbone dihedral angles (General, Glycine, Proline, Pre-Pro).
defaults:
  - override /data: amino_general
  - override /model: meanflow_amino
  - override /callbacks: default
  - override /trainer: default

tags: ["amino", "conditional", "meanflow"]
seed: 0

trainer:
  min_epochs: 1
  max_epochs: 300
  gradient_clip_val: null

model:
  _target_: gfm.models.CondAminoModule
  n_classes: 4
  net:
    d_in: 6
    d_out: 2
  optimizer:
    lr: 1e-4
    weight_decay: 0.001
  prop_equal_times: 0.75
  my_method: "mf"
  val_step: 8

data:
  batch_size: 4096
  data_type: cond4
