_target_: gfm.models.AminogfmModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}
  eta_min: 1e-6

net:
  _target_: gfm.models.arch.rfm.TMLP
  d_model: 512
  num_layers: 4
  actfn: swish
  d_in: 2

prop_equal_times: 0.1
in_shape:
  - 2

# compile model for faster training with pytorch 2.0
compile: false
manifold: flat_torus

# structured prior. prior_type: uniform (original RMF) | cluster (sphere) | gmm (sphere, SO(3), flat torus)
prior_type: uniform
prior_k: 16
prior_kappa_scale: 0.5
prior_coupling: matched   # cluster: matched | independent ; gmm: soft | hard | independent | hot
prior_fit_seed: 0
prior_select: bic        # gmm only: bic | cv | fixed
prior_cov_scale: 2.0     # gmm only: inflation of fitted covariances
prior_fit_max_points: 10000  # gmm only: random subsample used to fit the prior
